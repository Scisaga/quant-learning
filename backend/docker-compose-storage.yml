# Storage 依赖：MinIO + PostgreSQL
# 用法：cd backend && docker compose -f docker-compose-storage.yml up -d
#
# 本地：.env 中 MINIO_ENDPOINT=http://localhost:9000, DATABASE_URL=postgresql://quant:quant@localhost:5432/quant_experiments
# 远程（如 10.0.0.16）：MINIO_ENDPOINT=http://10.0.0.16:9000, DATABASE_URL=postgresql://quant:quant@10.0.0.16:5432/quant_experiments
#
# 数据库初始化：python -m backend.scripts.init_db [--host 10.0.0.16]

services:
  minio:
    image: minio/minio:latest
    container_name: quant-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: quant-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant_experiments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_experiments"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  postgres_data:
